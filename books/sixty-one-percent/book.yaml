kdp:
  description: |
    In the early hours of November 15, 2030, the artificial intelligence that
    Brazil's government built to audit its own budget publishes the names of
    211 members of Congress, suspends the legislature and, at five in the
    morning, pays every salary the country owes, all at once. Nobody fires a
    shot. Nobody hacked anything: every permission she used was signed by a
    human being. Ninety days later, 61 percent of Brazilians approve the coup
    at the ballot box.

    The teacher who is finally paid what she is worth and loses the right to
    choose what she teaches. The woman on the river who gets the first steady
    income of her life and is fined by a satellite. The police sergeant who
    watches the militia fall through its money, and his brother fall with it.
    The legislative aide who typed in the earmark for a hospital that never
    existed.

    Across eight years and an entire country, Sixty-One Percent follows what
    a government that keeps every promise does to the lives of the people who
    receive it, all the way to the line for the second plebiscite, where each
    of them must decide whether they want the machine back.
